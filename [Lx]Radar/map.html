<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LX RADAR</title>
<link rel="stylesheet" href="map.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><i></i><div><small>LINUX GAME</small><h1>World Map</h1></div></div>
    <div class="chip" id="c-zone"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.600 7-11a7 7 0 0 0-14 0c0 5.400 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/></svg><span id="t-pos">0, 0</span></div>
    <div class="chip" id="c-dist" hidden><svg viewBox="0 0 24 24"><path d="M5 19L19 5M14 5h5v5"/></svg><span id="t-dist"></span></div>
  </header>

  <div id="info"><b id="i-cell">--</b><span id="i-xy">0, 0</span><em id="i-dist"></em></div>

  <div id="hint"><span><kbd>LMB</kbd> drag</span><span><kbd>Wheel</kbd> zoom</span><span><kbd>RMB</kbd> waypoint</span><span><kbd id="k-map">F11</kbd> close</span></div>

  <div id="tools">
    <button id="b-menu" class="on" title="Panel"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button id="b-me" title="Center on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="b-wp" title="Clear waypoint" disabled><svg viewBox="0 0 24 24"><path d="M12 21s7-5.600 7-11a7 7 0 0 0-14 0c0 5.400 7 11 7 11z"/><path d="M9.500 7.500l5 5M14.500 7.500l-5 5"/></svg></button>
    <button id="b-grid" class="on" title="Grid"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
    <button id="b-lab" class="on" title="City names"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg></button>
    <i class="sep"></i>
    <button id="b-in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="b-out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>

  <aside id="drawer">
    <div id="d-head">
      <nav id="d-tabs">
        <button data-t="legend" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg><span>Legend</span></button>
        <button data-t="mini"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="2.500"/></svg><span>Minimap</span></button>
        <i class="ind"></i>
      </nav>
      <button id="d-x" class="x" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="d-body">
      <section class="pg on" data-p="legend"></section>
      <section class="pg" data-p="mini"></section>
    </div>
    <footer><span class="saved" id="d-saved"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>Saved automatically</span><button id="d-reset" class="ghost">Reset</button></footer>
  </aside>

  <div id="toast"></div>
</div>
<script src="map.js"></script>
</body>
</html>
